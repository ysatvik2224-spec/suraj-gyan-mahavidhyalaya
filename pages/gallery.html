<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery — Photos & Videos | Suraj Gyan Mahavidyalaya, Konch (Jalaun)</title>
  <meta name="description" content="Photo and video gallery of Suraj Gyan Mahavidyalaya, Konch (Jalaun): campus, classrooms, library, laboratories, events and sports.">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#761F25">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <script>(function(){try{document.documentElement.setAttribute("data-theme",localStorage.getItem("sgm-theme")||"light");}catch(e){}})();</script>
</head>
<body data-root="../">
  <script src="../js/page-transition.js"></script>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="page-banner">
      <div class="container">
        <p class="breadcrumb"><a href="../index.html">Home</a> › Gallery</p>
        <h1 data-hi="गैलरी">Gallery</h1>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section-head">
          <h2 data-hi="परिसर की तस्वीरें और वीडियो">Photos &amp; Videos</h2>
          <p>A look at our campus, classrooms, library, laboratories, events and sports.
             Select a category to filter the photos, and click any photo to view it larger.</p>
        </div>

        <!-- EDIT: add photo/video links in media-config.js — no code changes needed here -->
        <div class="tabs" role="tablist" aria-label="Gallery type">
          <button class="tab" type="button" role="tab" id="tab-photos" data-tab="photos"
                  aria-controls="photosPanel" aria-selected="true">Photos</button>
          <button class="tab" type="button" role="tab" id="tab-videos" data-tab="videos"
                  aria-controls="videosPanel" aria-selected="false">Videos</button>
        </div>

        <div class="chips" id="galFilters" role="group" aria-label="Filter photos by category"></div>

        <div id="photosPanel" role="tabpanel" aria-labelledby="tab-photos">
          <div class="masonry" id="galGrid"></div>
        </div>

        <div id="videosPanel" role="tabpanel" aria-labelledby="tab-videos" hidden>
          <div class="video-grid" id="videoGrid"></div>
        </div>
      </div>
    </section>

    <!-- ========================== LIGHTBOX ============================ -->
    <dialog id="lightbox" aria-label="Photo viewer">
      <div class="lb-stage">
        <figure>
          <img id="lbImg" src="" alt="">
          <figcaption id="lbCap"></figcaption>
        </figure>
        <button class="modal-close lb-close" type="button" data-close aria-label="Close viewer">&#10005;</button>
        <button class="lb-nav lb-prev" id="lbPrev" type="button" aria-label="Previous photo">&#10094;</button>
        <button class="lb-nav lb-next" id="lbNext" type="button" aria-label="Next photo">&#10095;</button>
      </div>
    </dialog>

    <!-- ======================== VIDEO MODAL =========================== -->
    <dialog id="videoModal" aria-labelledby="videoTitle">
      <div class="modal-head">
        <h2 id="videoTitle">Video</h2>
        <button class="modal-close" type="button" data-close aria-label="Close video">&#10005;</button>
      </div>
      <div id="videoStage"></div>
    </dialog>
  </main>

  <div id="site-footer"></div>
  <script src="../media-config.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/gallery.js"></script>
</body>
</html>
