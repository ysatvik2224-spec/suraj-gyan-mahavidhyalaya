<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Suraj Gyan Mahavidyalaya emblem">
  <title>Suraj Gyan Mahavidyalaya</title>
  <defs>
    <path id="nameArc" d="M 58 214 A 142 142 0 0 1 342 214"/>
    <path id="mottoArc" d="M 70 306 A 172 150 0 0 0 330 306"/>
    <clipPath id="disc"><circle cx="200" cy="200" r="176"/></clipPath>
  </defs>

  <!-- outer ring -->
  <circle cx="200" cy="200" r="197" fill="#f6eed4"/>
  <circle cx="200" cy="200" r="190" fill="#a5121c"/>
  <circle cx="200" cy="200" r="176" fill="#f8f0d8"/>

  <!-- emblem mark -->
  <g clip-path="url(#disc)">
    <circle cx="200" cy="176" r="72" fill="#f38b1c"/>
    <path d="M200 104 A72 72 0 0 0 128 176" fill="none" stroke="#cc1122" stroke-width="24" stroke-linecap="butt"/>
    <path d="M272 176 A72 72 0 0 0 200 104" fill="none" stroke="#cc1122" stroke-width="24" stroke-linecap="butt"/>
    <path d="M128 176 H164" stroke="#cc1122" stroke-width="24"/>
    <path d="M236 176 H272" stroke="#cc1122" stroke-width="24"/>
    <rect x="190" y="96" width="20" height="150" fill="#cc1122"/>
    <path d="M112 190 A88 88 0 0 0 200 264" fill="none" stroke="#cc1122" stroke-width="22"/>
    <path d="M288 190 A88 88 0 0 1 200 264" fill="none" stroke="#cc1122" stroke-width="22"/>
    <path d="M96 206 V300 h34" fill="none" stroke="#cc1122" stroke-width="24"/>
    <path d="M304 206 V300 h-34" fill="none" stroke="#cc1122" stroke-width="24"/>
  </g>

  <!-- open book -->
  <g>
    <path d="M196 296 L128 268 L134 246 L200 274 Z" fill="#111"/>
    <path d="M204 296 L272 268 L266 246 L200 274 Z" fill="#111"/>
    <path d="M200 288 L138 262 L143 248 L200 274 Z" fill="#ffffff" stroke="#e8b429" stroke-width="4"/>
    <path d="M200 288 L262 262 L257 248 L200 274 Z" fill="#ffffff" stroke="#e8b429" stroke-width="4"/>
    <path d="M200 274 V288" stroke="#e8b429" stroke-width="5"/>
    <path d="M168 268 L196 280" stroke="#d9d3c2" stroke-width="2"/>
    <path d="M232 268 L204 280" stroke="#d9d3c2" stroke-width="2"/>
  </g>

  <!-- institute name -->
  <text font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#111" letter-spacing="1.5">
    <textPath href="#nameArc" startOffset="50%" text-anchor="middle">SURAJ GYAN MAHAVIDHYALAYA</textPath>
  </text>

  <!-- motto band -->
  <path d="M 32 292 A 176 176 0 0 0 368 292 L 368 330 A 186 186 0 0 1 32 330 Z" fill="#a5121c"/>
  <text font-family="'Noto Sans Devanagari', Arial, sans-serif" font-size="26" font-weight="700" fill="#ffffff">
    <textPath href="#mottoArc" startOffset="50%" text-anchor="middle">ज्ञान - विज्ञानं विमुक्तये</textPath>
  </text>
</svg>
